       its own policy forbids Google-served ads on screens without publisher

       for it on 404s specifically. The site runs Auto ads, so pasting the tag
       here would be asking Google to place one. Every real page has it. -->
</head>

    <div class="container" style="text-align:center;">
      <span class="pill">404</span>
      <h1 style="margin-top:16px;">This page floated away 🫧</h1>
      <p class="lead" style="margin:0 auto;">The page you're looking for doesn't exist.</p>
      <div class="hero-actions" style="justify-content:center;">

      </div>
    </div>
  </section>
</body>
